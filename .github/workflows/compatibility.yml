name: Encoder compatibility

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "src/**"
      - "tests/**"
      - "scripts/preload_role_models.py"
      - ".github/workflows/compatibility.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: encoder-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: ${{ matrix.profile }} / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: minimum
            python: "3.10"
          - profile: current
            python: "3.12"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install qualified dependency stack
        run: |
          python -m pip install torch -c tests/compatibility/${{ matrix.profile }}.txt --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]" -c tests/compatibility/${{ matrix.profile }}.txt
          python -m pip check
      - name: Run unit tests without Hub access
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: python -m pytest -q
      - name: Preload pinned MiniLM and E5 encoders
        timeout-minutes: 10
        env:
          HF_HUB_DISABLE_XET: "1"
        run: python scripts/preload_role_models.py
      - name: Run pinned role-aware acceptance tests offline
        timeout-minutes: 10
        env:
          NEEMBED_REAL_STACK: "1"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: python -m pytest -vv -s --durations=10 tests/integration/test_real_stack_v11.py
