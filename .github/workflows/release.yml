name: Release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "pyproject.toml"
      - "src/**"
      - "tests/integration/**"
      - "tests/test_release_metadata.py"
      - "tests/test_v11_release_hardening.py"
      - ".github/RELEASE_NOTES.md"
      - ".github/RELEASE_CHECKLIST.md"
      - "scripts/preload_role_models.py"
      - ".github/workflows/release.yml"
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run normal tests
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: python -m pytest -q

      - name: Preload real-stack sentence model
        timeout-minutes: 5
        env:
          HF_HUB_DISABLE_XET: "1"
        run: |
          python - <<'PY'
          from sentence_transformers import SentenceTransformer

          model = SentenceTransformer("sentence-transformers/all-MiniLM-L6-v2")
          print(
              "Cached sentence-transformers/all-MiniLM-L6-v2 "
              f"with dimension {model.get_sentence_embedding_dimension()}"
          )
          PY

      - name: Preload pinned role-aware sentence models
        timeout-minutes: 10
        env:
          HF_HUB_DISABLE_XET: "1"
        run: python scripts/preload_role_models.py

      - name: Run real-stack acceptance tests
        timeout-minutes: 10
        env:
          NEEMBED_REAL_STACK: "1"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: python -m pytest -vv -s --durations=20 tests/integration

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "v${PACKAGE_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${PACKAGE_VERSION}."
            exit 1
          fi

      - name: Verify release tag points at current main
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin main
          MAIN_SHA="$(git rev-parse FETCH_HEAD)"
          if [ "${GITHUB_SHA}" != "${MAIN_SHA}" ]; then
            echo "Release tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, not current main ${MAIN_SHA}."
            exit 1
          fi
          echo "Release tag ${GITHUB_REF_NAME} validated at main SHA ${GITHUB_SHA}."

  build:
    name: Build distributions
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install packaging tools
        run: python -m pip install build twine

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Store distributions
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/neembed-geoopt
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  smoke-testpypi:
    name: Smoke test TestPyPI package
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: publish-testpypi
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download validated build artifact
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: /tmp/neembed-built

      - name: Download wheel from TestPyPI
        shell: bash
        run: |
          PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          mkdir -p /tmp/neembed-testpypi
          for attempt in 1 2 3 4 5 6; do
            rm -f /tmp/neembed-testpypi/*
            if python -m pip download \
              --no-deps \
              --only-binary=:all: \
              --index-url https://test.pypi.org/simple/ \
              --dest /tmp/neembed-testpypi \
              "neembed-geoopt==${PACKAGE_VERSION}"; then
              break
            fi
            if [ "${attempt}" -eq 6 ]; then
              exit 1
            fi
            sleep 10
          done

      - name: Verify TestPyPI wheel matches validated source artifact
        shell: bash
        run: |
          BUILT_WHEEL="$(find /tmp/neembed-built -maxdepth 1 -name 'neembed_geoopt-*.whl' -print -quit)"
          PUBLISHED_WHEEL="$(find /tmp/neembed-testpypi -maxdepth 1 -name 'neembed_geoopt-*.whl' -print -quit)"
          test -n "${BUILT_WHEEL}"
          test -n "${PUBLISHED_WHEEL}"
          test "$(sha256sum "${BUILT_WHEEL}" | cut -d' ' -f1)" = "$(sha256sum "${PUBLISHED_WHEEL}" | cut -d' ' -f1)"

      - name: Fresh install TestPyPI wheel
        run: python -m pip install /tmp/neembed-testpypi/neembed_geoopt-*.whl pytest

      - name: Verify installed version and v0.4-v0.11 smoke
        shell: bash
        run: |
          PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python -c "from importlib.metadata import version; import neembed; assert version('neembed-geoopt') == '${PACKAGE_VERSION}'"
          python -m pytest -q \
            tests/test_import.py \
            tests/test_v04_learnable_structure.py \
            tests/test_v05_retrieval_example.py \
            tests/test_v06_exact_retrieval_example.py \
            tests/test_v07_objective_comparison_example.py \
            tests/test_v08_hierarchy_learning_example.py \
            tests/test_v09_constant_curvature_comparison_example.py \
            tests/test_v10_mixed_curvature_workflow_example.py \
            tests/test_v11_role_example.py \
            tests/test_role_prompts.py \
            tests/test_encode_batching.py \
            tests/test_model_metadata.py

      - name: Report TestPyPI-validated source commit
        run: echo "TestPyPI validated source commit ${GITHUB_SHA}"

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/neembed-geoopt
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  smoke-pypi:
    name: Smoke test PyPI package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: publish-pypi
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download validated build artifact
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: /tmp/neembed-built

      - name: Download wheel from PyPI
        shell: bash
        run: |
          PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          mkdir -p /tmp/neembed-pypi
          for attempt in 1 2 3 4 5 6; do
            rm -f /tmp/neembed-pypi/*
            if python -m pip download \
              --no-deps \
              --only-binary=:all: \
              --dest /tmp/neembed-pypi \
              "neembed-geoopt==${PACKAGE_VERSION}"; then
              break
            fi
            if [ "${attempt}" -eq 6 ]; then
              exit 1
            fi
            sleep 10
          done

      - name: Verify PyPI wheel matches validated source artifact
        shell: bash
        run: |
          BUILT_WHEEL="$(find /tmp/neembed-built -maxdepth 1 -name 'neembed_geoopt-*.whl' -print -quit)"
          PUBLISHED_WHEEL="$(find /tmp/neembed-pypi -maxdepth 1 -name 'neembed_geoopt-*.whl' -print -quit)"
          test -n "${BUILT_WHEEL}"
          test -n "${PUBLISHED_WHEEL}"
          test "$(sha256sum "${BUILT_WHEEL}" | cut -d' ' -f1)" = "$(sha256sum "${PUBLISHED_WHEEL}" | cut -d' ' -f1)"

      - name: Fresh install PyPI wheel
        run: python -m pip install /tmp/neembed-pypi/neembed_geoopt-*.whl pytest

      - name: Verify installed version and v0.4-v0.11 smoke
        shell: bash
        run: |
          PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python -c "from importlib.metadata import version; import neembed; assert version('neembed-geoopt') == '${PACKAGE_VERSION}'"
          python -m pytest -q \
            tests/test_import.py \
            tests/test_v04_learnable_structure.py \
            tests/test_v05_retrieval_example.py \
            tests/test_v06_exact_retrieval_example.py \
            tests/test_v07_objective_comparison_example.py \
            tests/test_v08_hierarchy_learning_example.py \
            tests/test_v09_constant_curvature_comparison_example.py \
            tests/test_v10_mixed_curvature_workflow_example.py \
            tests/test_v11_role_example.py \
            tests/test_role_prompts.py \
            tests/test_encode_batching.py \
            tests/test_model_metadata.py

  verify-hosted-docs:
    name: Verify hosted v0.11 docs
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: smoke-pypi
    runs-on: ubuntu-latest

    steps:
      - name: Verify Read the Docs deployed the release-specific v0.11 build
        shell: bash
        run: |
          PACKAGE_VERSION="${GITHUB_REF_NAME#v}"
          EXPECTED_DOC_TITLE="neembed ${PACKAGE_VERSION}"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL \
              https://neembed.readthedocs.io/en/latest/user_guide/constant_curvature_semantics.html \
              -o /tmp/neembed-constant-curvature.html \
              && grep -F "${EXPECTED_DOC_TITLE}" /tmp/neembed-constant-curvature.html >/dev/null \
              && grep -F "v0.9" /tmp/neembed-constant-curvature.html >/dev/null \
              && curl -fsSL \
                https://neembed.readthedocs.io/en/latest/user_guide/mixed_curvature.html \
                -o /tmp/neembed-mixed-curvature.html \
              && grep -F "${EXPECTED_DOC_TITLE}" /tmp/neembed-mixed-curvature.html >/dev/null \
              && grep -F "v0.10" /tmp/neembed-mixed-curvature.html >/dev/null \
              && curl -fsSL \
                https://neembed.readthedocs.io/en/latest/user_guide/api_contracts.html \
                -o /tmp/neembed-api-contracts.html \
              && grep -F "${EXPECTED_DOC_TITLE}" /tmp/neembed-api-contracts.html >/dev/null \
              && grep -F "encode_query" /tmp/neembed-api-contracts.html >/dev/null \
              && grep -F "batch_size" /tmp/neembed-api-contracts.html >/dev/null \
              && curl -fsSL \
                https://neembed.readthedocs.io/en/latest/user_guide/encoder_compatibility.html \
                -o /tmp/neembed-encoder-compatibility.html \
              && grep -F "${EXPECTED_DOC_TITLE}" /tmp/neembed-encoder-compatibility.html >/dev/null \
              && grep -F "5.4.1" /tmp/neembed-encoder-compatibility.html >/dev/null \
              && curl -fsSL \
                https://neembed.readthedocs.io/en/latest/user_guide/benchmark_protocol.html \
                -o /tmp/neembed-benchmark-protocol.html \
              && grep -F "${EXPECTED_DOC_TITLE}" /tmp/neembed-benchmark-protocol.html >/dev/null \
              && grep -F "optimizer_steps" /tmp/neembed-benchmark-protocol.html >/dev/null; then
              echo "Hosted Read the Docs matches ${EXPECTED_DOC_TITLE} and contains v0.9/v0.10 geometry and v0.11 API, compatibility and benchmark guidance."
              exit 0
            fi
            if [ "${attempt}" -eq 6 ]; then
              echo "Hosted Read the Docs did not expose the ${EXPECTED_DOC_TITLE} geometry and v0.11 API/compatibility/benchmark builds."
              exit 1
            fi
            sleep 10
          done

  create-github-release:
    name: Create GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [smoke-pypi, verify-hosted-docs]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out release notes from the validated tag
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Create concise release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "GitHub Release ${GITHUB_REF_NAME} already exists."
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "neembed ${GITHUB_REF_NAME}" \
            --notes-file .github/RELEASE_NOTES.md
