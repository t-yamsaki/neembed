name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run normal tests
        run: python -m pytest -q

      - name: Preload real-stack sentence model
        timeout-minutes: 5
        env:
          HF_HUB_DISABLE_XET: "1"
        run: |
          python - <<'PY'
          from sentence_transformers import SentenceTransformer

          model = SentenceTransformer("sentence-transformers/all-MiniLM-L6-v2")
          print(
              "Cached sentence-transformers/all-MiniLM-L6-v2 "
              f"with dimension {model.get_sentence_embedding_dimension()}"
          )
          PY

      - name: Run real-stack acceptance tests
        timeout-minutes: 10
        env:
          NEEMBED_REAL_STACK: "1"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: python -m pytest -vv -s --durations=20 tests/integration

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "v${PACKAGE_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${PACKAGE_VERSION}."
            exit 1
          fi

      - name: Verify release tag points at current main
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin main
          MAIN_SHA="$(git rev-parse FETCH_HEAD)"
          if [ "${GITHUB_SHA}" != "${MAIN_SHA}" ]; then
            echo "Release tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, not current main ${MAIN_SHA}."
            exit 1
          fi
          echo "Release tag ${GITHUB_REF_NAME} validated at main SHA ${GITHUB_SHA}."

  build:
    name: Build distributions
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install packaging tools
        run: python -m pip install build twine

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Store distributions
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/neembed-geoopt
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  smoke-testpypi:
    name: Smoke test TestPyPI package
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: publish-testpypi
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download validated build artifact
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: /tmp/neembed-built

      - name: Download wheel from TestPyPI
        shell: bash
        run: |
          PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          mkdir -p /tmp/neembed-testpypi
          for attempt in 1 2 3 4 5 6; do
            rm -f /tmp/neembed-testpypi/*
            if python -m pip download \
              --no-deps \
              --only-binary=:all: \
              --index-url https://test.pypi.org/simple/ \
              --dest /tmp/neembed-testpypi \
              "neembed-geoopt==${PACKAGE_VERSION}"; then
              break
            fi
            if [ "${attempt}" -eq 6 ]; then
              exit 1
            fi
            sleep 10
          done

      - name: Verify TestPyPI wheel matches validated source artifact
        shell: bash
        run: |
          BUILT_WHEEL="$(find /tmp/neembed-built -maxdepth 1 -name 'neembed_geoopt-*.whl' -print -quit)"
          PUBLISHED_WHEEL="$(find /tmp/neembed-testpypi -maxdepth 1 -name 'neembed_geoopt-*.whl' -print -quit)"
          test -n "${BUILT_WHEEL}"
          test -n "${PUBLISHED_WHEEL}"
          test "$(sha256sum "${BUILT_WHEEL}" | cut -d' ' -f1)" = "$(sha256sum "${PUBLISHED_WHEEL}" | cut -d' ' -f1)"

      - name: Fresh install TestPyPI wheel
        run: python -m pip install /tmp/neembed-testpypi/neembed_geoopt-*.whl pytest

      - name: Verify installed version and v0.4-v0.7 smoke
        shell: bash
        run: |
          PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python -c "from importlib.metadata import version; import neembed; assert version('neembed-geoopt') == '${PACKAGE_VERSION}'"
          python -m pytest -q \
            tests/test_import.py \
            tests/test_v04_learnable_structure.py \
            tests/test_v05_retrieval_example.py \
            tests/test_v06_exact_retrieval_example.py \
            tests/test_v07_objective_comparison_example.py

      - name: Report TestPyPI-validated source commit
        run: echo "TestPyPI validated source commit ${GITHUB_SHA}"

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/neembed-geoopt
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  smoke-pypi:
    name: Smoke test PyPI package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: publish-pypi
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download validated build artifact
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: /tmp/neembed-built

      - name: Download wheel from PyPI
        shell: bash
        run: |
          PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          mkdir -p /tmp/neembed-pypi
          for attempt in 1 2 3 4 5 6; do
            rm -f /tmp/neembed-pypi/*
            if python -m pip download \
              --no-deps \
              --only-binary=:all: \
              --dest /tmp/neembed-pypi \
              "neembed-geoopt==${PACKAGE_VERSION}"; then
              break
            fi
            if [ "${attempt}" -eq 6 ]; then
              exit 1
            fi
            sleep 10
          done

      - name: Verify PyPI wheel matches validated source artifact
        shell: bash
        run: |
          BUILT_WHEEL="$(find /tmp/neembed-built -maxdepth 1 -name 'neembed_geoopt-*.whl' -print -quit)"
          PUBLISHED_WHEEL="$(find /tmp/neembed-pypi -maxdepth 1 -name 'neembed_geoopt-*.whl' -print -quit)"
          test -n "${BUILT_WHEEL}"
          test -n "${PUBLISHED_WHEEL}"
          test "$(sha256sum "${BUILT_WHEEL}" | cut -d' ' -f1)" = "$(sha256sum "${PUBLISHED_WHEEL}" | cut -d' ' -f1)"

      - name: Fresh install PyPI wheel
        run: python -m pip install /tmp/neembed-pypi/neembed_geoopt-*.whl pytest

      - name: Verify installed version and v0.4-v0.7 smoke
        shell: bash
        run: |
          PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python -c "from importlib.metadata import version; import neembed; assert version('neembed-geoopt') == '${PACKAGE_VERSION}'"
          python -m pytest -q \
            tests/test_import.py \
            tests/test_v04_learnable_structure.py \
            tests/test_v05_retrieval_example.py \
            tests/test_v06_exact_retrieval_example.py \
            tests/test_v07_objective_comparison_example.py

  verify-hosted-docs:
    name: Verify hosted v0.7 docs
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: smoke-pypi
    runs-on: ubuntu-latest

    steps:
      - name: Verify Read the Docs contains v0.7 objective guidance
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL \
              https://neembed.readthedocs.io/en/latest/user_guide/retrieval_objectives.html \
              -o /tmp/neembed-retrieval-objectives.html \
              && grep -F "v0.7" /tmp/neembed-retrieval-objectives.html >/dev/null; then
              echo "Hosted Read the Docs contains v0.7 retrieval-objective guidance."
              exit 0
            fi
            if [ "${attempt}" -eq 6 ]; then
              echo "Hosted Read the Docs did not expose v0.7 retrieval-objective guidance."
              exit 1
            fi
            sleep 10
          done

  create-github-release:
    name: Create GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [smoke-pypi, verify-hosted-docs]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create concise release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "GitHub Release ${GITHUB_REF_NAME} already exists."
            exit 0
          fi
          cat > release-notes.md <<'EOF'
          v0.7.0 adds manifold retrieval objectives for aligned Triplet, MarginMSE, direct distance regression, and opt-in symmetric MNRL, plus graded exact-corpus evaluation with nDCG@K.

          The v0.6 exact corpus search, multi-positive MRR / Recall@K evaluator, offline hard-negative mining, the v0.5 retrieval surface, Poincaré and Lorentz Geoopt semantics, and the v0.4 learnable-curvature / manifold-prototype path remain supported. The included v0.7 objective-comparison workflow is an engineering regression reference, not a research benchmark or a claim of objective superiority. Hierarchy-native objectives, new manifold families, ANN/vector databases, and distributed retrieval remain out of scope.
          EOF
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "neembed ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
