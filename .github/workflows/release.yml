name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run normal tests
        run: python -m pytest -q

      - name: Run real-stack acceptance tests
        env:
          NEEMBED_REAL_STACK: "1"
        run: python -m pytest -q tests/integration

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "v${PACKAGE_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${PACKAGE_VERSION}."
            exit 1
          fi

  build:
    name: Build distributions
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install packaging tools
        run: python -m pip install build twine

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Store distributions
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/neembed-geoopt
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  smoke-testpypi:
    name: Smoke test TestPyPI package
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: publish-testpypi
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download wheel from TestPyPI
        shell: bash
        run: |
          PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          mkdir -p /tmp/neembed-testpypi
          for attempt in 1 2 3 4 5 6; do
            rm -f /tmp/neembed-testpypi/*
            if python -m pip download \
              --no-deps \
              --only-binary=:all: \
              --index-url https://test.pypi.org/simple/ \
              --dest /tmp/neembed-testpypi \
              "neembed-geoopt==${PACKAGE_VERSION}"; then
              break
            fi
            if [ "${attempt}" -eq 6 ]; then
              exit 1
            fi
            sleep 10
          done

      - name: Fresh install TestPyPI wheel
        run: python -m pip install /tmp/neembed-testpypi/neembed_geoopt-*.whl pytest

      - name: Verify installed version and v0.4 smoke
        shell: bash
        run: |
          PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python -c "from importlib.metadata import version; import neembed; assert version('neembed-geoopt') == '${PACKAGE_VERSION}'"
          python -m pytest -q tests/test_import.py tests/test_v04_learnable_structure.py

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/neembed-geoopt
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  smoke-pypi:
    name: Smoke test PyPI package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: publish-pypi
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fresh install PyPI package
        shell: bash
        run: |
          PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          for attempt in 1 2 3 4 5 6; do
            if python -m pip install --no-cache-dir "neembed-geoopt==${PACKAGE_VERSION}" pytest; then
              break
            fi
            if [ "${attempt}" -eq 6 ]; then
              exit 1
            fi
            sleep 10
          done

      - name: Verify installed version and v0.4 smoke
        shell: bash
        run: |
          PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python -c "from importlib.metadata import version; import neembed; assert version('neembed-geoopt') == '${PACKAGE_VERSION}'"
          python -m pytest -q tests/test_import.py tests/test_v04_learnable_structure.py

  create-github-release:
    name: Create GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: smoke-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create concise release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "GitHub Release ${GITHUB_REF_NAME} already exists."
            exit 0
          fi
          cat > release-notes.md <<'EOF'
          v0.4.0 adds opt-in learnable curvature for Poincaré and Lorentz models, trainable manifold-valued prototypes, a focused hierarchy-aware objective, and an explicit caller-supplied Geoopt Riemannian optimizer path for mixed Euclidean/manifold training.

          The existing fixed-curvature model-only path remains backward-compatible and continues to use AdamW by default. The included learnable-structure example is an engineering regression check, not a claim that learnable structure is generally superior to fixed structure.
          EOF
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "neembed ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
